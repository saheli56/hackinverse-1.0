name: behavior.lock CI Enforcement

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  verify-behavior-contract:
    name: Enforce Runtime Behavior Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run behavior.lock Check
        run: |
          npx behaviorlock check --visual
        env:
          CI: true

      - name: Upload Visual Security Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavior-security-report
          path: behavior.html
